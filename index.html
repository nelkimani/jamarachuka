<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jamara Uniforms — Chuka Branch POS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --navy:#6d1a34;
  --navy-2:#4a1224;
  --navy-3:#9c2d4c;
  --gold:#c8952c;
  --gold-2:#e0ac3f;
  --cream:#f7f4ec;
  --paper:#ffffff;
  --ink:#1a1f2b;
  --muted:#6b7280;
  --line:#e4e1d6;
  --green:#1f7a4d;
  --red:#b3372c;
  --amber:#b3781f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
input,textarea{user-select:text;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#cfc9b8;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#app{height:100vh;width:100vw;display:flex;flex-direction:column;}

/* ---------- Login ---------- */
.login-screen{
  min-height:100vh;width:100vw;
  background:
    radial-gradient(circle at 15% 15%, rgba(200,149,44,0.18), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(200,149,44,0.12), transparent 45%),
    linear-gradient(160deg, var(--navy) 0%, #0b1626 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;
  overflow-y:auto;padding:32px 16px;
}
.login-brand{text-align:center;margin-bottom:clamp(20px,5vh,44px);}
.login-brand img{width:clamp(90px,22vw,150px);}
.login-brand .crest{
  width:74px;height:74px;border-radius:50%;
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
  background:rgba(200,149,44,0.08);
}
.login-brand h1{font-size:34px;letter-spacing:6px;margin:0;font-weight:700;}
.login-brand h2{font-size:clamp(11px,3vw,14px);letter-spacing:5px;color:var(--gold-2);margin:8px 0 0;font-weight:600;}
.login-accounts{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:820px;padding:0 12px;}
.account-btn{
  width:210px;max-width:80vw;padding:28px 18px;border-radius:18px;border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.06);backdrop-filter:blur(6px);
  color:#fff;text-align:center;transition:transform .15s ease, background .15s ease;
}
.account-btn:active{transform:scale(0.97);}
.account-btn:hover{background:rgba(255,255,255,0.12);}
.account-avatar{
  width:64px;height:64px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;color:var(--navy);
  background:linear-gradient(135deg,var(--gold-2),var(--gold));
}
.account-name{font-size:19px;font-weight:700;margin-bottom:4px;}
.account-role{font-size:12px;letter-spacing:2px;color:#c9d3e6;text-transform:uppercase;}
.login-footer{margin-top:28px;color:rgba(255,255,255,0.45);font-size:12px;letter-spacing:1px;text-align:center;}
@media (max-height:640px){
  .login-brand{margin-bottom:16px;}
  .login-brand img{width:clamp(64px,16vw,100px);}
  .account-btn{padding:16px 14px;}
  .account-avatar{width:48px;height:48px;margin-bottom:8px;}
  .login-footer{margin-top:14px;}
}
@media (max-width:400px){
  .login-accounts{gap:14px;}
  .account-btn{width:100%;max-width:260px;}
}

.pin-overlay{
  position:fixed;inset:0;background:rgba(8,14,26,0.86);
  display:flex;align-items:center;justify-content:center;z-index:200;
  padding:16px;overflow-y:auto;
}
.pin-box{
  background:var(--paper);border-radius:20px;padding:32px 30px;width:340px;max-width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);max-height:100%;overflow-y:auto;
}
.pin-box h3{margin:0 0 4px;font-size:20px;}
.pin-box p{margin:0 0 18px;color:var(--muted);font-size:13px;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy-3);}
.pin-dot.filled{background:var(--navy-3);}
.pin-error{color:var(--red);font-size:13px;height:16px;margin-bottom:8px;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.keypad button{
  height:58px;border-radius:14px;border:1px solid var(--line);background:#fbfaf6;
  font-size:20px;font-weight:600;color:var(--ink);
}
.keypad button:active{background:#efe9d8;}
.keypad button.wide{grid-column:span 1;font-size:14px;color:var(--muted);}
.pin-cancel{margin-top:16px;background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;}

/* ---------- Shell ---------- */
.shell{display:flex;height:100vh;width:100vw;}
.sidebar{
  width:112px;background:var(--navy);color:#fff;display:flex;flex-direction:column;
  align-items:center;padding:16px 0;flex-shrink:0;
}
.sidebar .brandmark{text-align:center;margin-bottom:14px;}
.sidebar .brandmark .crest{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;margin:0 auto 6px;
}
.sidebar .brandmark div{font-size:9px;letter-spacing:1.5px;color:var(--gold-2);font-weight:700;}
.nav-scroll{flex:1;overflow-y:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:8px;}
.nav-btn{
  width:92px;padding:11px 4px;border:none;background:transparent;color:#c9d3e6;
  border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;
  letter-spacing:.3px;font-weight:600;
}
.nav-btn svg{width:20px;height:20px;}
.nav-btn.active{background:var(--gold);color:var(--navy);}
.nav-btn:not(.active):active{background:rgba(255,255,255,0.08);}
.sidebar-footer{width:100%;padding-top:8px;border-top:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;align-items:center;gap:6px;}
.user-chip{text-align:center;color:#fff;font-size:11px;padding:4px 0;}
.user-chip b{display:block;font-size:12.5px;}
.logout-btn{width:92px;padding:9px 4px;border:none;background:rgba(179,55,44,0.25);color:#ffcac4;border-radius:10px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;}
.logout-btn svg{width:18px;height:18px;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--cream);}
.topbar{
  height:56px;flex-shrink:0;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
}
.topbar h2{font-size:17px;margin:0;font-weight:700;color:var(--navy);}
.topbar .meta{font-size:12.5px;color:var(--muted);display:flex;gap:16px;align-items:center;}
.badge-shift{background:#e7f4ec;color:var(--green);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-shift.off{background:#f2e3e1;color:var(--red);}
.content{flex:1;overflow-y:auto;padding:18px 20px;}

/* ---------- Buttons / generic ---------- */
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--navy-3);color:#fff;}
.btn-primary:active{background:var(--navy);}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-gold:active{background:var(--gold-2);}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy-3);}
.btn-danger{background:var(--red);color:#fff;}
.btn-muted{background:#eee9db;color:var(--ink);}
.btn-lg{padding:16px 22px;font-size:16px;border-radius:14px;}
.btn:disabled{opacity:.4;}
.card{background:var(--paper);border-radius:16px;border:1px solid var(--line);}
.pill{padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700;}
input[type=text],input[type=number],input[type=password],select,textarea{
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;
  background:#fff;color:var(--ink);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-3);outline-offset:1px;}
label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 12px;background:#f2efe4;color:var(--navy);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;}
td{padding:10px 12px;border-top:1px solid var(--line);}
tr:hover td{background:#faf8f1;}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,16,28,0.55);display:flex;align-items:center;justify-content:center;z-index:150;padding:16px;}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,0.35);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:17px;color:var(--navy);}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.close-x{border:none;background:#f2efe4;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .2s ease;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state svg{width:44px;height:44px;color:#c9c3ae;margin-bottom:10px;}

/* ---------- POS ---------- */
.pos-layout{display:flex;height:100%;gap:16px;}
.pos-left{flex:1;display:flex;flex-direction:column;min-width:0;}
.pos-right{width:380px;flex-shrink:0;display:flex;flex-direction:column;}
.search-row{display:flex;gap:10px;margin-bottom:12px;}
.search-box{flex:1;position:relative;}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);}
.search-box input{padding-left:42px;height:50px;font-size:15px;border-radius:14px;}
.school-select-btn{
  height:50px;min-width:220px;border-radius:14px;border:1.5px solid var(--gold);background:#fff8ec;
  color:var(--navy);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;gap:8px;
}
.school-select-btn svg{width:16px;height:16px;flex-shrink:0;}
.school-select-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quick-schools{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;}
.qs-btn{flex-shrink:0;padding:9px 16px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
.qs-btn.active{background:var(--navy-3);color:#fff;border-color:var(--navy-3);}
.qs-btn.clear-btn{border-color:var(--red);color:var(--red);}
.cat-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;}
.cat-btn{flex-shrink:0;padding:9px 15px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;}
.cat-btn.active{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.filter-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.filter-row select{width:auto;min-width:110px;height:38px;padding:6px 10px;font-size:12.5px;}
.product-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;align-content:start;padding-bottom:10px;}
.product-card{
  background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;
  min-height:150px;cursor:pointer;transition:background .1s ease,transform .1s ease;
}
.product-card:active{background:#f6f2e6;transform:scale(0.98);}
.product-card.oos{opacity:.55;cursor:default;}
.product-card.oos:active{background:#fff;transform:none;}
.pc-cat{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;}
.pc-name{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.25;min-height:34px;}
.pc-meta{font-size:11.5px;color:var(--muted);}
.pc-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.pc-price{font-size:15px;font-weight:800;color:var(--ink);}
.pc-stock{font-size:10.5px;color:var(--muted);}
.pc-add{background:var(--navy-3);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12px;}
.pc-add:disabled{background:#d8d2bf;color:#8b8672;}
.pc-oos-tag{background:#f2e3e1;color:var(--red);font-size:10px;font-weight:800;padding:4px 8px;border-radius:8px;text-align:center;white-space:nowrap;}

.cart-card{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.cart-head h3{margin:0;font-size:15px;color:var(--navy);}
.cart-items{flex:1;overflow-y:auto;padding:8px 12px;}
.cart-item{padding:10px 4px;border-bottom:1px dashed var(--line);}
.ci-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);}
.ci-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.ci-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:#f2efe4;border-radius:10px;padding:4px;}
.qty-ctrl button{width:28px;height:28px;border:none;border-radius:7px;background:#fff;font-weight:800;font-size:15px;color:var(--navy);}
.qty-ctrl span{min-width:22px;text-align:center;font-weight:700;font-size:13px;}
.ci-remove{border:none;background:none;color:var(--red);}
.ci-remove svg{width:16px;height:16px;}
.ci-total{font-weight:800;font-size:13.5px;}
.cart-totals{padding:14px 16px;border-top:1px solid var(--line);background:#fbfaf5;}
.tot-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;color:var(--muted);}
.tot-row.grand{font-size:19px;font-weight:800;color:var(--navy);margin-top:8px;}
.cart-actions{display:flex;gap:8px;padding:12px 16px;}
.cart-actions .btn{flex:1;justify-content:center;}

/* Cash keypad */
.cash-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.cash-pad button{height:46px;border-radius:10px;border:1px solid var(--line);background:#fbfaf6;font-weight:700;font-size:16px;}
.pay-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.pay-method{padding:16px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:center;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.pay-method.active{border-color:var(--navy-3);background:#eef1fb;color:var(--navy-3);}
.pay-method svg{width:22px;height:22px;}

/* ---------- Receipt ---------- */
.receipt-wrap{display:flex;justify-content:center;padding:14px;}
.receipt{width:300px;background:#fff;padding:16px 14px;font-family:'Courier New',monospace;font-size:12px;color:#111;border:1px solid #ddd;}
.receipt h4{text-align:center;margin:0;font-size:14px;letter-spacing:1px;}
.receipt .sub{text-align:center;font-size:11px;margin:2px 0;}
.receipt hr{border:none;border-top:1px dashed #999;margin:8px 0;}
.rline{display:flex;justify-content:space-between;font-size:11.5px;margin:2px 0;}
.ritem td{padding:2px 0;font-size:11px;border:none;}
.receipt table{font-size:11px;}
.receipt th{background:none;padding:2px 0;font-size:10px;position:static;}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat-card{padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.stat-val{font-size:24px;font-weight:800;color:var(--navy);margin-top:6px;}
.stat-card.warn .stat-val{color:var(--amber);}
.stat-card.bad .stat-val{color:var(--red);}
.chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px;}
.chart-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;}
.chart-box h4{margin:0 0 10px;font-size:13.5px;color:var(--navy);}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-head h2{margin:0;font-size:19px;color:var(--navy);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.toolbar input,.toolbar select{width:auto;min-width:140px;}
.tag{display:inline-block;background:#eef1fb;color:var(--navy-3);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;margin:1px 2px 1px 0;}
.status-instock{color:var(--green);font-weight:700;}
.status-low{color:var(--amber);font-weight:700;}
.status-out{color:var(--red);font-weight:700;}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}
.checklist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;}
.checklist label{display:flex;align-items:center;gap:8px;text-transform:none;font-weight:600;color:var(--ink);font-size:13px;letter-spacing:0;}
.tab-row{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.tab-btn{padding:10px 16px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;}
.tab-btn.active{color:var(--navy);border-color:var(--gold);}
.fullset-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);}
.fullset-row input[type=number]{width:70px;}

/* Continuous-roll 80mm thermal paper (XP-Q80A). "auto" height lets the
   printer/driver cut after the content instead of forcing an A4/Letter
   page and feeding a lot of blank paper. */
@page{
  size:80mm auto;
  margin:0;
}
@media print{
  html,body{
    height:auto !important;
    width:80mm !important;
    overflow:visible !important;
    margin:0 !important;
    padding:0 !important;
    background:#fff !important;
  }
  /* Hide the whole app UI (and any open modal, which lives inside #app)
     instead of visibility:hidden — visibility:hidden still reserves its
     layout space, which is what causes extra blank pages/feed on a
     receipt printer. display:none removes it from the flow entirely. */
  #app, #toastWrap{ display:none !important; }
  #print-area{
    display:block !important;
    position:static !important;
    width:80mm;
    margin:0;
    padding:0;
  }
  /* Printable width on the XP-Q80A is narrower than the 80mm paper itself
     (roughly 72-76mm between the guides) — sizing the ticket to exactly
     80mm risks clipping the right edge, so keep small side margins. */
  #print-area .receipt{
    border:none;
    width:76mm;
    max-width:76mm;
    margin:0 auto;
    padding:2mm 2mm 6mm;
    font-size:11px;
  }
  #print-area .receipt img{ max-width:34mm; height:auto; }
  #print-area table{ width:100%; }
}
.hidden{display:none!important;}
/* Off-screen except when printing (see @media print above). Previously this
   relied only on body{overflow:hidden} clipping it, which is fragile. */
#print-area{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>
<div class="toast-wrap" id="toastWrap"></div>

/* ---------------- Utility ---------------- */
function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function fmt(n){ return 'KSh ' + Math.round(n).toLocaleString('en-KE'); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
function dateDisplay(d){ d = new Date(d); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function timeDisplay(d){ d = new Date(d); let h=d.getHours(); const m=pad(d.getMinutes()); const ap = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12; return h+':'+m+' '+ap; }
function icon(name, cls){ return `<i data-lucide="${name}" class="${cls||''}"></i>`; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type?' '+type:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

function schoolCodeFrag(schoolId){ return schoolId.split('-')[0].toUpperCase().slice(0,4); }
function catFrag(cat){ return cat.replace(/[^A-Z]/gi,'').toUpperCase().slice(0,4); }

function generateDemoProducts(schools){
  const products = [];
  let counter = 1;
  schools.forEach(school => {
    let templates = LEVEL_TEMPLATES[school.level] || LEVEL_TEMPLATES.JSS;
    // Translight gets bow ties instead of / in addition to regular ties
    if(school.id.startsWith('translight')){
      templates = templates.concat([{cat:'BOW TIE', name:'School Bow Tie', gender:'Unisex', color:'Navy', sizes:['Standard'], cost:100, price:200}]);
    }
    templates.forEach(t => {
      t.sizes.forEach(size => {
        const sku = 'JAM-CHU-'+catFrag(t.cat)+'-'+String(counter).padStart(4,'0');
        counter++;
        const stock = Math.floor(Math.random()*22)+2;
        products.push({
          id: uid('prod'),
          sku,
          name: t.name,
          category: t.cat,
          schools: [school.id],
          gender: t.gender,
          size,
          color: t.color,
          cost: t.cost,
          price: t.price,
          stock,
          minStock: 5,
          barcode: sku,
          supplier: 'In-house Production',
          active: true,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      });
    });
  });
  return products;
}

function mergeSharedProducts(products, schools){
  // Make a handful of common items (white shirt, grey socks) shared across nearby schools,
  // to demonstrate multi-school product assignment rather than every item being unique.
  const secondary = schools.filter(s=>s.level==='Secondary').map(s=>s.id);
  if(secondary.length>1){
    products.filter(p=>p.category==='SOCKS' && secondary.includes(p.schools[0])).forEach(p=>{
      p.schools = secondary.slice();
    });
  }
  return products;
}

function seedDatabase(){
  const schools = schoolDefs();
  schools.slice(0,11).forEach(s=> s.quickAccess = true); // default quick-access set
  let products = generateDemoProducts(schools);
  products = mergeSharedProducts(products, schools);
  products = products.concat(generateTracksuitProducts());
  // T-shirt stock lines are added by loadDB()'s one-time migration (see generateTshirtStockProducts),
  // so they're seeded exactly once whether this is a brand-new DB or an existing saved one.

  const fullSets = {};
  schools.forEach(school => {
    const items = products.filter(p => p.category!=='TRACKSUIT' && p.schools.includes(school.id));
    if(!items.length) return;
    // build one representative full set: 2x shirt/tshirt/dress-type, 1x everything else, skip ties duplicated
    const bySize = {};
    items.forEach(p=>{ if(!bySize[p.category]) bySize[p.category]=p; });
    const set = [];
    Object.values(bySize).forEach(p=>{
      const qty = ['SHIRT','TROUSER','TSHIRT','DRESS','SHORTS','SOCKS'].includes(p.category) ? 2 : 1;
      set.push({productId:p.id, qty});
    });
    fullSets[school.id] = set;
  });

  return {
    settings: freshSettings(),
    users: [
      {id:'jane', name:'Jane', role:'Manager'},
      {id:'ken', name:'Ken', role:'Cashier'},
      {id:'makena', name:'Makena', role:'Cashier'}
    ],
    schools,
    products,
    fullSets,
    sales: [],
    shifts: [],
    activity: [],
    stockMovements: [],
    counters: { receipt: 1 }
  };
}

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){
    try{ DB = JSON.parse(raw); }
    catch(e){ console.error('Corrupted local data, reseeding.', e); DB = seedDatabase(); }
  } else {
    DB = seedDatabase();
  }
  // defensive defaults for older saves
  if(!DB.settings) DB.settings = freshSettings();
  if(!DB.settings.pins) DB.settings.pins = freshSettings().pins;
  if(!DB.settings.usbPrinter) DB.settings.usbPrinter = freshSettings().usbPrinter;
  if(!DB.stockMovements) DB.stockMovements = [];
  if(!DB.fullSets) DB.fullSets = {};
  // one-time migration: add the T-shirt stock-taking lines to any DB that predates them,
  // without touching existing products, sales, shifts or other saved data
  if(!DB.tshirtStockSeeded){
    DB.products = DB.products.concat(generateTshirtStockProducts());
    DB.tshirtStockSeeded = true;
  }
  saveDB();
}
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }catch(e){
    console.error(e);
    toast('Could not save data locally — storage may be full.', 'err');
  }
}

}

  session.pinBuffer += d;

function checkPin(){
  const user = DB.users.find(u=>u.id===session.pinTarget);
  const pin = DB.settings.pins[user.id];
  if(session.pinBuffer === pin){
    session.user = user;
    session.pinTarget = null; session.pinBuffer='';
    logActivity(user.name, 'Login', '');
    saveDB();
    // resume open shift if cashier has one
    if(user.role==='Cashier'){
      const openShift = DB.shifts.find(s=>s.cashier===user.name && s.status==='OPEN');
      session.shift = openShift ? openShift.id : null;
      session.screen = 'pos';

    setTimeout(render,50);
  } else {
    session.pinError = 'Incorrect PIN, try again.';

function withinRange(ts, range){
  const d = new Date(ts);
  const now = new Date();
  if(range==='today') return d.toDateString()===now.toDateString();
  if(range==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); return d.toDateString()===y.toDateString(); }
  if(range==='week'){ const wk=new Date(now); wk.setDate(wk.getDate()-7); return d>=wk; }
  if(range==='month'){ return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }
  return true;
}

let chartInstances = {};
function killChart(id){ if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; } }
function drawDashboardCharts(){
  if(typeof Chart==='undefined') return;
  const validSales = DB.sales.filter(s=>s.status!=='VOIDED');

  // Last 7 days
  const days = []; const dayTotals = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d.toLocaleDateString('en-GB',{weekday:'short'}));
    const total = validSales.filter(s=>new Date(s.createdAt).toDateString()===d.toDateString()).reduce((a,s)=>a+s.total,0);
    dayTotals.push(total);
  }
  const c1 = document.getElementById('chartDaily');
  if(c1){ killChart('daily'); chartInstances.daily = new Chart(c1, {type:'line', data:{labels:days, datasets:[{label:'Sales (KSh)', data:dayTotals, borderColor:'#6d1a34', backgroundColor:'rgba(109,26,52,0.12)', fill:true, tension:.35}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}}); }

  // Category this month
  const catTotals = {};
  validSales.filter(s=>withinRange(s.createdAt,'month')).forEach(s=> s.items.forEach(it=>{ catTotals[it.category]=(catTotals[it.category]||0)+it.total; }));
  const c2 = document.getElementById('chartCategory');
  if(c2){ killChart('cat'); chartInstances.cat = new Chart(c2, {type:'doughnut', data:{labels:Object.keys(catTotals).map(k=>CAT_LABEL[k]||k), datasets:[{data:Object.values(catTotals), backgroundColor:['#6d1a34','#9c2d4c','#c8952c','#1f7a4d','#b3372c','#6b7280','#e0ac3f','#7a5cff','#2fa3c2','#c26b3c','#4f9c7c','#c2c23c','#3c65c2','#8a5a2f']}]}, options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}}}}}); }

  // School this month
  const schoolTotals = {};
  validSales.filter(s=>withinRange(s.createdAt,'month')).forEach(s=> s.items.forEach(it=>{ schoolTotals[it.school]=(schoolTotals[it.school]||0)+it.total; }));
  const sortedSchools = Object.entries(schoolTotals).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const c3 = document.getElementById('chartSchool');
  if(c3){ killChart('school'); chartInstances.school = new Chart(c3, {type:'bar', data:{labels:sortedSchools.map(s=>s[0]), datasets:[{label:'Sales', data:sortedSchools.map(s=>s[1]), backgroundColor:'#c8952c'}]}, options:{indexAxis:'y', plugins:{legend:{display:false}}}}); }

  // Weekly trend last 6 weeks
  const wLabels = []; const wTotals = [];
  for(let i=5;i>=0;i--){
    const end = new Date(); end.setDate(end.getDate()-(i*7));
    const start = new Date(end); start.setDate(start.getDate()-6);
    wLabels.push('W'+(6-i));
    const total = validSales.filter(s=>{ const t=new Date(s.createdAt); return t>=start && t<=end; }).reduce((a,s)=>a+s.total,0);
    wTotals.push(total);
  }
  const c4 = document.getElementById('chartWeekly');
  if(c4){ killChart('weekly'); chartInstances.weekly = new Chart(c4, {type:'bar', data:{labels:wLabels, datasets:[{label:'Sales', data:wTotals, backgroundColor:'#9c2d4c'}]}, options:{plugins:{legend:{display:false}}}}); }
}

/* ================= POS ================= */
function stockStatus(p){
  if(p.stock<=0) return 'out';
  if(p.stock<=p.minStock) return 'low';
  return 'ok';
}
function productMatchesFilters(p){
  if(!p.active) return false;
  if(session.selectedSchoolId && !p.schools.includes(session.selectedSchoolId)) return false;
  if(session.selectedCategory!=='ALL' && p.category!==session.selectedCategory) return false;
  if(session.filterSize && p.size!==session.filterSize) return false;
  if(session.filterGender && p.gender!==session.filterGender) return false;
  if(session.filterColor && p.color!==session.filterColor) return false;
  if(session.searchTerm){
    const t = session.searchTerm.toLowerCase();
    const schoolNames = p.schools.map(id=>{ const s=DB.schools.find(x=>x.id===id); return s?s.name.toLowerCase():''; }).join(' ');
    const hay = [p.name,p.sku,p.barcode,p.category,p.color,p.gender,p.size,schoolNames].join(' ').toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}
function schoolName(id){ const s=DB.schools.find(x=>x.id===id); return s?s.name:id; }
function schoolShort(id){ const s=DB.schools.find(x=>x.id===id); return s?s.short:id; }

/* ---- Cart ---- */
function addToCart(productId){
  const p = DB.products.find(x=>x.id===productId);
  if(!p || p.stock<=0) return;
  const existing = session.cart.find(c=>c.productId===productId);
  const inCartQty = existing?existing.qty:0;
  if(inCartQty+1 > p.stock){ toast('Not enough stock available.', 'err'); return; }
  if(existing){ existing.qty++; }
  else {
    session.cart.push({
      productId: p.id, name:p.name, category:p.category,
      school: p.schools.length>1 ? p.schools.map(schoolShort).join(', ') : schoolName(p.schools[0]),
      size:p.size, color:p.color, price:p.price, qty:1
    });
  }
  render();
}
function changeQty(productId, delta){
  const item = session.cart.find(c=>c.productId===productId);
  if(!item) return;
  const p = DB.products.find(x=>x.id===productId);
  const newQty = item.qty+delta;
  if(newQty<=0){ session.cart = session.cart.filter(c=>c.productId!==productId); }
  else if(p && newQty>p.stock){ toast('Not enough stock available.', 'err'); return; }
  else item.qty = newQty;
  render();
}
function removeFromCart(productId){ session.cart = session.cart.filter(c=>c.productId!==productId); render(); }
function clearCart(){ session.cart=[]; session.discountPct=0; session.discountAmt=0; session.discountApprovedBy=null; render(); }

function renderCartItem(item){
  return `
  <div class="cart-item">
    <div class="ci-top"><span>${esc(item.name)}</span><span class="ci-total">${fmt(item.price*item.qty)}</span></div>
    <div class="ci-sub">${esc(item.school)} • ${esc(item.size)} • ${esc(item.color)}</div>
    <div class="ci-bottom">
      <div class="qty-ctrl">
        <button onclick="changeQty('${item.productId}',-1)">−</button>
        <span>${item.qty}</span>
        <button onclick="changeQty('${item.productId}',1)">+</button>
      </div>
      <button class="ci-remove" onclick="removeFromCart('${item.productId}')">${icon('trash-2')}</button>
    </div>
  </div>`;
}
function cartSubtotal(){ return session.cart.reduce((a,i)=>a+i.price*i.qty,0); }
function cartDiscount(){
  const sub = cartSubtotal();
  if(session.discountAmt) return Math.min(session.discountAmt, sub);
  if(session.discountPct) return sub*session.discountPct/100;
  return 0;
}
function cartTotal(){ return Math.max(0, cartSubtotal()-cartDiscount()); }
function renderCartTotals(){
  const sub = cartSubtotal(), disc = cartDiscount(), total = cartTotal();
  return `
  <div class="cart-totals">
    <div class="tot-row"><span>Subtotal</span><span>${fmt(sub)}</span></div>
    <div class="tot-row">
      <span>Discount ${disc>0?'':''}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        ${fmt(disc)}
        <button class="btn btn-muted" style="padding:4px 8px;font-size:11px;" onclick="openModal('discount')">Edit</button>
      </span>
    </div>
    <div class="tot-row grand"><span>Total</span><span>${fmt(total)}</span></div>
  </div>`;
}
function holdSale(){
  if(!session.cart.length) return;
  session.heldSale = { cart: JSON.parse(JSON.stringify(session.cart)), schoolId: session.selectedSchoolId };
  session.cart = [];
  toast('Sale held. You can resume it anytime.', 'ok');
  render();
}
function resumeHeldSale(){
  if(!session.heldSale) return;
  session.cart = session.heldSale.cart;
  session.selectedSchoolId = session.heldSale.schoolId;
  session.heldSale = null;
  render();
}

/* ---- Full uniform sets ---- */
function addFullSet(schoolId){
  const set = DB.fullSets[schoolId];
  if(!set || !set.length){ toast('No full set configured for this school.', 'err'); return; }
  let added = 0, blocked = 0;
  set.forEach(entry=>{
    const p = DB.products.find(x=>x.id===entry.productId && x.active);
    if(!p) return;
    const existing = session.cart.find(c=>c.productId===p.id);
    const already = existing?existing.qty:0;
    const canAdd = Math.max(0, Math.min(entry.qty, p.stock-already));
    if(canAdd<=0){ blocked++; return; }
    if(existing) existing.qty += canAdd;
    else session.cart.push({ productId:p.id, name:p.name, category:p.category, school: schoolName(schoolId), size:p.size, color:p.color, price:p.price, qty:canAdd });
    added++;
  });
  if(blocked) toast(blocked+' item(s) in the full set are out of stock and were skipped.', 'err');
  else toast('Full uniform set added to cart.', 'ok');
  render();
}

      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        ${step>1?`<button class="btn btn-muted" onclick="session.cuStep=${step-1}; renderCompleteUniformStep();">Back</button>`:''}
        ${step<4?`<button class="btn btn-primary" onclick="completeUniformNext()">Next</button>`:`<button class="btn btn-gold" onclick="addCompleteUniformSelections()">${icon('check')}<span>Add Selected</span></button>`}

function completeUniformNext(){
  const step = session.cuStep||1;
  if(step===1){
    const sel = document.getElementById('cuSchool');
    session.cuSchool = sel ? sel.value : session.cuSchool;
    if(!session.cuSchool){ toast('Please select a school.', 'err'); return; }
  }
  if(step===2 && !session.cuGender){ toast('Please select a gender/level.', 'err'); return; }
  if(step===3){
    const sel = document.getElementById('cuSize');
    session.cuSize = sel ? sel.value : session.cuSize;
    if(!session.cuSize){ toast('Please select a size.', 'err'); return; }
  }
  session.cuStep = step+1;
  renderCompleteUniformStep();
}
function renderCompleteUniformStep(){
  const el = document.querySelector('.modal-backdrop');
  if(el){ el.outerHTML = renderCompleteUniformModal(); if(window.lucide) lucide.createIcons(); }
}
function addCompleteUniformSelections(){
  const checked = Array.from(document.querySelectorAll('.cu-item:checked')).map(el=>el.value);
  let added=0;
  checked.forEach(id=>{
    const p = DB.products.find(x=>x.id===id);
    if(!p || p.stock<=0) return;
    addToCartSilent(p.id);
    added++;
  });
  session.cuStep=1; session.cuSchool=null; session.cuGender=null; session.cuSize=null;
  closeModal();
  if(added) toast(added+' item(s) added to cart.', 'ok');
}
function addToCartSilent(productId){
  const p = DB.products.find(x=>x.id===productId);
  if(!p || p.stock<=0) return;
  const existing = session.cart.find(c=>c.productId===productId);
  if(existing){ if(existing.qty<p.stock) existing.qty++; }
  else session.cart.push({ productId:p.id, name:p.name, category:p.category, school: schoolName(p.schools[0]), size:p.size, color:p.color, price:p.price, qty:1 });
}

/* ---- School picker modal ---- */
function renderSchoolPickerModal(){

function completeSale(){
  const total = cartTotal();
  const method = session.payMethod||'CASH';
  if(method==='CASH'){
    const received = parseFloat(session.cashReceived)||0;
    if(received<total){ toast('Cash received is less than the total.', 'err'); return; }
  }
  if(method==='MPESA' && !session.mpesaCode.trim()){ toast('M-PESA transaction code is required.', 'err'); return; }

  // Deduct stock & build sale record
  const sub = cartSubtotal(), disc = cartDiscount();
  const receiptNo = DB.settings.receiptPrefix+'-'+todayStr()+'-'+String(DB.counters.receipt).padStart(4,'0');
  DB.counters.receipt++;

  const items = session.cart.map(c=>({productId:c.productId,name:c.name,school:c.school,size:c.size,color:c.color,qty:c.qty,price:c.price,total:c.price*c.qty,category:c.category}));
  items.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.productId);
    if(p){
      const prev = p.stock;
      p.stock = Math.max(0, p.stock-it.qty);
      DB.stockMovements.unshift({id:uid('mv'), productId:p.id, type:'Sale', qty:-it.qty, prevStock:prev, newStock:p.stock, user:session.user.name, date:Date.now(), reason:'Sale '+receiptNo});
    }
  });

  const sale = {
    id: uid('sale'), receiptNo, createdAt: Date.now(),
    cashier: session.user.name, items, subtotal:sub, discount:disc,
    discountApprovedBy: session.discountApprovedBy||null,
    total, paymentMethod: method, mpesaCode: method==='MPESA'?session.mpesaCode.trim().toUpperCase():null,
    cashReceived: method==='CASH'?parseFloat(session.cashReceived)||0:null,
    status:'COMPLETED'
  };
  DB.sales.unshift(sale);

  const shift = currentShiftObj();
  if(shift){
    shift.transactions++;
    if(method==='CASH') shift.cashSales+=total;
    else if(method==='MPESA') shift.mpesaSales+=total;
    else if(method==='CARD') shift.cardSales+=total;
    else shift.otherSales+=total;
    shift.expectedCash = shift.openingCash+shift.cashSales;
  }

  logActivity(session.user.name, 'Sale', 'Receipt '+receiptNo+' — '+fmt(total));
  saveDB();

  session.lastSale = sale;
  session.cart = [];
  session.discountPct=0; session.discountAmt=0; session.discountApprovedBy=null;
  session.activeModal = 'receipt';
  render();
}

/* ---- USB thermal printer (raw ESC/POS via WebUSB — Chrome/Edge desktop only) ----
   No print dialog, no driver: bytes go straight to the printer over USB. WebUSB requires
   a secure context (https:// or localhost) and isn't available in Safari/Firefox, so
   printReceiptForSale() always falls back to the normal browser print (window.print()) when
   it's unsupported, not connected, or a transfer fails. */
let usbPrinterDevice = null;
let usbPrinterEndpoint = null;

function usbSupported(){ return 'usb' in navigator; }

async function claimUsbPrinter(device){
  try{
    if(!device.opened) await device.open();
  }catch(err){
    // On Windows, this almost always means a kernel driver (Windows' built-in printer
    // class driver, or the printer's own installed driver) already has the device open —
    // WebUSB can't share it. See the guidance surfaced in connectUsbPrinter()'s catch block.
    if(err && err.name==='SecurityError'){
      throw Object.assign(new Error('Access denied opening the device — see the note below for the Windows fix.'), {code:'WINDOWS_DRIVER_CONFLICT'});
    }
    throw err;
  }
  if(device.configuration === null) await device.selectConfiguration(1);
  // Printers are USB class 7; fall back to the first interface if the class isn't reported that way.
  let iface = device.configuration.interfaces.find(i=>
    i.alternates.some(a=>a.interfaceClass===7)) || device.configuration.interfaces[0];
  try{
    await device.claimInterface(iface.interfaceNumber);
  }catch(err){
    if(err && (err.name==='SecurityError' || /claim/i.test(err.message||''))){
      throw Object.assign(new Error('Access denied claiming the USB interface — see the note below for the Windows fix.'), {code:'WINDOWS_DRIVER_CONFLICT'});
    }
    throw err;
  }
  const alt = iface.alternates.find(a=>a.interfaceClass===7) || iface.alternates[0];
  const outEp = alt.endpoints.find(e=>e.direction==='out');
  if(!outEp) throw new Error('No OUT endpoint found on this USB device.');
  usbPrinterDevice = device;
  usbPrinterEndpoint = outEp.endpointNumber;
}

async function connectUsbPrinter(){
  if(!usbSupported()){ toast('WebUSB isn\'t supported in this browser. Use Chrome or Edge on desktop.', 'err'); return; }
  try{
    const device = await navigator.usb.requestDevice({ filters: [] });
    await claimUsbPrinter(device);
    DB.settings.usbPrinter.vendorId = device.vendorId;
    DB.settings.usbPrinter.productId = device.productId;
    DB.settings.usbPrinter.productName = device.productName || '';
    DB.settings.usbPrinter.enabled = true;
    session.usbPrinterError = null;
    saveDB();
    toast('Printer connected: '+(device.productName||'USB device'), 'ok');
    render();
  }catch(err){
    if(err && err.name==='NotFoundError'){ /* user cancelled the chooser — no toast needed */ return; }
    if(err && err.code==='WINDOWS_DRIVER_CONFLICT'){
      session.usbPrinterError = 'windows-driver';
      toast('Access denied — Windows has its own driver attached to the printer. See the fix below.', 'err');
      render();
      return;
    }
    session.usbPrinterError = null;
    toast('Couldn\'t connect to printer: '+err.message, 'err');
  }
}

// Called once on load: reconnects without a picker/prompt to a device the user already
// authorized in a previous session (browsers remember WebUSB grants per-origin).
async function reconnectUsbPrinterSilently(){
  if(!usbSupported()) return;
  const saved = DB.settings.usbPrinter;
  if(!saved || !saved.vendorId) return;
  try{
    const devices = await navigator.usb.getDevices();
    const device = devices.find(d=>d.vendorId===saved.vendorId && d.productId===saved.productId);
    if(device){ await claimUsbPrinter(device); render(); }
  }catch(err){ /* silent — user can reconnect manually from Settings if needed */ }
}

async function forgetUsbPrinter(){
  try{ if(usbPrinterDevice){ await usbPrinterDevice.close(); } }catch(err){}
  usbPrinterDevice = null; usbPrinterEndpoint = null;
  DB.settings.usbPrinter.vendorId = null;
  DB.settings.usbPrinter.productId = null;
  DB.settings.usbPrinter.productName = '';
  DB.settings.usbPrinter.enabled = false;
  saveDB(); toast('Printer forgotten.', 'ok'); render();
}

async function sendEscPos(bytes){
  if(!usbPrinterDevice || usbPrinterEndpoint===null) throw new Error('No USB printer connected.');
  const result = await usbPrinterDevice.transferOut(usbPrinterEndpoint, bytes);
  if(result.status!=='ok') throw new Error('USB transfer status: '+result.status);
}

/* ---- ESC/POS byte builder ---- */
const ESC = 0x1B, GS = 0x1D;
function escPosBuilder(){
  const chunks = [];
  return {
    raw(...bytes){ chunks.push(new Uint8Array(bytes)); return this; },
    text(str){ chunks.push(new TextEncoder().encode(str)); return this; },
    line(str=''){ chunks.push(new TextEncoder().encode(str+'\n')); return this; },
    init(){ return this.raw(ESC,0x40); },
    align(a){ return this.raw(ESC,0x61, a==='center'?1:a==='right'?2:0); },
    bold(on){ return this.raw(ESC,0x45, on?1:0); },
    doubleSize(on){ return this.raw(GS,0x21, on?0x11:0x00); },
    feed(n){ return this.raw(ESC,0x64, n); },
    cut(){ return this.raw(GS,0x56,0x42,0x00); },
    build(){
      let len=0; chunks.forEach(c=>len+=c.length);
      const out = new Uint8Array(len); let o=0;
      chunks.forEach(c=>{ out.set(c,o); o+=c.length; });
      return out;
    }
  };
}
function wrapText(str, width){
  str = String(str||'');
  const out = []; let cur = '';
  str.split(' ').forEach(word=>{
    while(word.length>width){ out.push(word.slice(0,width)); word = word.slice(width); }
    if((cur+' '+word).trim().length>width){ out.push(cur); cur = word; }
    else cur = (cur+' '+word).trim();
  });
  if(cur) out.push(cur);
  return out.length?out:[''];
}
function twoCol(left, right, width){
  left = String(left); right = String(right);
  const gap = width - left.length - right.length;
  return gap>0 ? left+' '.repeat(gap)+right : left.slice(0,width-right.length-1)+' '+right;
}
function buildEscPosReceipt(sale){
  const w = (DB.settings.usbPrinter && DB.settings.usbPrinter.charsPerLine) || 32;
  const dash = '-'.repeat(w);
  const b = escPosBuilder().init();
  b.align('center').doubleSize(true).bold(true).line(DB.settings.businessName).doubleSize(false).bold(false);
  b.line(DB.settings.branch);
  b.line(DB.settings.phone);
  b.align('left').line(dash);
  b.line(twoCol('Receipt No:', sale.receiptNo, w));
  b.line(twoCol('Date:', dateDisplay(sale.createdAt), w));
  b.line(twoCol('Time:', timeDisplay(sale.createdAt), w));
  b.line(twoCol('Cashier:', sale.cashier, w));
  b.line(dash);
  sale.items.forEach(it=>{
    wrapText(it.name+' ('+it.size+')', w).forEach(l=>b.line(l));
    b.line(twoCol('  '+it.qty+' x '+fmt(it.price), fmt(it.total), w));
  });
  b.line(dash);
  b.line(twoCol('Subtotal', fmt(sale.subtotal), w));
  b.line(twoCol('Discount', fmt(sale.discount), w));
  b.bold(true).line(twoCol('TOTAL', fmt(sale.total), w)).bold(false);
  b.line(twoCol('Payment', sale.paymentMethod, w));
  if(sale.paymentMethod==='CASH' && sale.cashReceived!=null){
    b.line(twoCol('Cash Tendered', fmt(sale.cashReceived), w));
    b.line(twoCol('Change', fmt(Math.max(0, sale.cashReceived-sale.total)), w));
  }
  if(sale.mpesaCode) b.line(twoCol('M-PESA Ref', sale.mpesaCode, w));
  if(sale.status && sale.status!=='COMPLETED') b.bold(true).line(twoCol('STATUS', sale.status, w)).bold(false);
  b.line(dash);
  b.align('center');
  wrapText(DB.settings.footer, w).forEach(l=>b.line(l));
  b.line('Built by MVULE Technologies');
  b.feed(3).cut();
  return b.build();
}
async function printEscPosReceipt(sale){
  await sendEscPos(buildEscPosReceipt(sale));
}
function usbPrinterReady(){
  return usbSupported() && !!usbPrinterDevice && DB.settings.usbPrinter && DB.settings.usbPrinter.enabled;
}
// Shared by both print entry points below: tries the USB thermal printer first (when enabled
// and connected), and falls back to the browser print dialog for anything else — no printer
// configured, Safari/Firefox, or a failed USB transfer.
async function printReceiptForSale(sale){
  if(usbPrinterReady()){
    try{ await printEscPosReceipt(sale); return; }
    catch(err){ toast('USB print failed, using browser print instead: '+err.message, 'err'); }

  document.getElementById('print-area').innerHTML = receiptHtml(sale);
  window.print();
}

    const w = (DB.settings.usbPrinter && DB.settings.usbPrinter.charsPerLine) || 32;
    const b = escPosBuilder().init().align('center').bold(true).line('TEST PRINT').bold(false)
      .line('-'.repeat(w)).line(DB.settings.businessName).line(new Date().toString().slice(0,24))
      .feed(3).cut();
    await sendEscPos(b.build());
    toast('Test ticket sent to printer.', 'ok');
  }catch(err){ toast('Test print failed: '+err.message, 'err'); }
}

function saveProductForm(id){
  const name = document.getElementById('pfName').value.trim();
  const category = document.getElementById('pfCategory').value;
  const gender = document.getElementById('pfGender').value;
  const size = document.getElementById('pfSize').value.trim();
  const color = document.getElementById('pfColor').value.trim();
  const cost = parseFloat(document.getElementById('pfCost').value)||0;
  const price = parseFloat(document.getElementById('pfPrice').value)||0;
  const minStockRaw = parseInt(document.getElementById('pfMinStock').value);
  const minStock = Number.isFinite(minStockRaw) ? minStockRaw : DB.settings.lowStockThreshold;
  const stock = parseInt(document.getElementById('pfStock').value)||0;
  let sku = document.getElementById('pfSku').value.trim();
  let barcode = document.getElementById('pfBarcode').value.trim();
  const supplier = document.getElementById('pfSupplier').value.trim();
  const schools = Array.from(document.querySelectorAll('#pfSchools input:checked')).map(el=>el.value);

  if(!name){ toast('Product name is required.', 'err'); return; }
  if(!schools.length){ toast('Assign the product to at least one school.', 'err'); return; }

  if(!sku){
    const n = DB.products.length+1;
    sku = 'JAM-CHU-'+catFrag(category)+'-'+String(n).padStart(4,'0');
  }
  const dupe = DB.products.find(p=>p.sku===sku && p.id!==id);
  if(dupe){ toast('Duplicate SKU. Please use a unique SKU.', 'err'); return; }
  if(!barcode) barcode = sku;
  const dupeBar = DB.products.find(p=>p.barcode===barcode && p.id!==id);
  if(dupeBar){ toast('Duplicate barcode.', 'err'); return; }

  if(id){
    const p = DB.products.find(x=>x.id===id);
    const prevStock = p.stock;
    Object.assign(p, {name,category,gender,size,color,cost,price,minStock,sku,barcode,supplier,schools,updatedAt:Date.now()});
    if(stock!==prevStock){
      p.stock = stock;
      DB.stockMovements.unshift({id:uid('mv'), productId:p.id, type:'Stock Adjustment', qty:stock-prevStock, prevStock, newStock:stock, user:session.user.name, date:Date.now(), reason:'Manual edit'});
    }
    logActivity(session.user.name, 'Product Updated', name);
  } else {
    DB.products.push({id:uid('prod'), sku, name, category, schools, gender, size, color, cost, price, stock, minStock, barcode, supplier, active:true, createdAt:Date.now(), updatedAt:Date.now()});
    logActivity(session.user.name, 'Product Created', name);
  }
  saveDB();
  closeModal();
  toast('Product saved.', 'ok');
}
function deleteProduct(id){
  const p = DB.products.find(x=>x.id===id);
  if(!p) return;
  p.active=false;
  logActivity(session.user.name, 'Product Deactivated', p.name);
  saveDB(); closeModal(); render();
}

function renderReturnTxModal(){

  return `

    <div class="modal" style="max-width:520px;">

                <td>${fmt(it.total)}</td>
                <td><button class="btn btn-muted" style="padding:5px 9px;font-size:11px;" onclick="returnSingleItem('${sale.id}', ${i})" ${it.returned>=it.qty?'disabled':''}>Return 1</button></td>
              </tr>`).join('')}
          </tbody>
        </table>

      </div>
      <div class="modal-foot">
        <button class="btn btn-danger" style="margin-right:auto;" onclick="voidTransaction('${sale.id}')" ${sale.status==='VOIDED'?'disabled':''}>${icon('ban')}<span>Void Entire Transaction</span></button>
        <button class="btn btn-muted" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>`;
}
function returnSingleItem(saleId, idx){
  const sale = DB.sales.find(s=>s.id===saleId);
  const item = sale.items[idx];
  item.returned = (item.returned||0)+1;
  const p = DB.products.find(x=>x.id===item.productId);
  if(p){
    const prev = p.stock;
    p.stock += 1;
    DB.stockMovements.unshift({id:uid('mv'), productId:p.id, type:'Return', qty:1, prevStock:prev, newStock:p.stock, user:session.user.name, date:Date.now(), reason:'Return on '+sale.receiptNo});
  }
  const allReturned = sale.items.every(it=>(it.returned||0)>=it.qty);
  const anyReturned = sale.items.some(it=>(it.returned||0)>0);
  sale.status = allReturned ? 'RETURNED' : (anyReturned ? 'PARTIALLY RETURNED' : 'COMPLETED');
  logActivity(session.user.name, 'Item Returned', item.name+' from '+sale.receiptNo);
  saveDB();
  const el = document.querySelector('.modal-backdrop');
  if(el){ el.outerHTML = renderReturnTxModal(); if(window.lucide) lucide.createIcons(); }
}
function voidTransaction(saleId){
  const sale = DB.sales.find(s=>s.id===saleId);
  sale.items.forEach(it=>{
    const remaining = it.qty-(it.returned||0);
    if(remaining<=0) return;
    const p = DB.products.find(x=>x.id===it.productId);
    if(p){
      const prev = p.stock;
      p.stock += remaining;
      DB.stockMovements.unshift({id:uid('mv'), productId:p.id, type:'Stock Adjustment', qty:remaining, prevStock:prev, newStock:p.stock, user:session.user.name, date:Date.now(), reason:'Void '+sale.receiptNo});
    }
    it.returned = it.qty;
  });
  sale.status = 'VOIDED';
  logActivity(session.user.name, 'Transaction Voided', sale.receiptNo);
  saveDB(); closeModal(); render();
}

function exportBackup(){
  // PINs are per-device login credentials, not shop data — they're deliberately left out of the
  // exported file so a shared/emailed/uploaded backup can't be used to log in as staff elsewhere.
  const exportData = JSON.parse(JSON.stringify(DB));
  delete exportData.settings.pins;
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'jamara-chuka-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logActivity(session.user.name, 'Backup Exported', '');
  saveDB();
}
function triggerRestore(){
  const fileInput = document.getElementById('restoreFile');
  if(!fileInput.files.length){ toast('Choose a backup file first.', 'err'); return; }
  session.pendingRestoreFile = fileInput.files[0];
  session.activeModal = 'restoreConfirm';
  render();
}

  return `
  <div class="modal-backdrop" onclick="closeModalBackdrop(event)">

      <div class="modal-head"><h3>Confirm Restore</h3><button class="close-x" onclick="closeModal()">${icon('x')}</button></div>

}
function doRestore(){
  const file = session.pendingRestoreFile;
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.products || !parsed.schools || !parsed.settings){ throw new Error('Invalid backup file.'); }
      // Backups (from Sep 2026 onward) intentionally exclude PINs — keep this device's own
      // login PINs rather than wiping them out, so restoring shop data can't lock staff out.
      const currentPins = DB && DB.settings ? DB.settings.pins : null;
      DB = parsed;
      if(!DB.settings.pins && currentPins) DB.settings.pins = currentPins;
      saveDB();
      closeModal();
      toast('Backup restored successfully.', 'ok');
      render();
    }catch(err){
      toast('Invalid or corrupted backup file.', 'err');
      closeModal();
    }
  };
  reader.readAsText(file);
}
function csvEscape(v){ v = String(v==null?'':v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function downloadCsv(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function exportCsv(type){
  if(type==='sales'){
    const rows = [['Receipt#','Date','Time','Cashier','Items','Total','Payment','Status']];
    DB.sales.forEach(s=>rows.push([s.receiptNo, dateDisplay(s.createdAt), timeDisplay(s.createdAt), s.cashier, s.items.reduce((a,i)=>a+i.qty,0), s.total, s.paymentMethod, s.status]));
    downloadCsv('sales-'+todayStr()+'.csv', rows);
  } else if(type==='inventory' || type==='products'){
    const rows = [['SKU','Name','Category','Schools','Size','Color','Cost','Price','Stock','MinStock','Status']];
    DB.products.forEach(p=>rows.push([p.sku,p.name,CAT_LABEL[p.category]||p.category,p.schools.map(schoolName).join('; '),p.size,p.color,p.cost,p.price,p.stock,p.minStock,p.active?'Active':'Inactive']));
    downloadCsv(type+'-'+todayStr()+'.csv', rows);
  } else if(type==='schoolSales'){
    const rows = [['School','Total Sales']];
    const bySchool = {};
    DB.sales.filter(s=>s.status!=='VOIDED').forEach(s=>s.items.forEach(it=>{ bySchool[it.school]=(bySchool[it.school]||0)+it.total; }));
    Object.entries(bySchool).forEach(([n,v])=>rows.push([n,v]));
    downloadCsv('school-sales-'+todayStr()+'.csv', rows);
  } else if(type==='movements'){
    const rows = [['Date','Product','Type','QtyChange','PrevStock','NewStock','User','Reason']];
    DB.stockMovements.forEach(m=>{ const p=DB.products.find(x=>x.id===m.productId); rows.push([dateDisplay(m.date)+' '+timeDisplay(m.date), p?p.name:m.productId, m.type, m.qty, m.prevStock, m.newStock, m.user, m.reason]); });
    downloadCsv('stock-movements-'+todayStr()+'.csv', rows);
  } else if(type==='shifts'){
    const rows = [['Cashier','Opened','Closed','OpeningCash','CashSales','MpesaSales','CardSales','Transactions','Expected','Actual','Difference','Status']];
    DB.shifts.forEach(s=>rows.push([s.cashier, dateDisplay(s.openedAt)+' '+timeDisplay(s.openedAt), s.closedAt?dateDisplay(s.closedAt)+' '+timeDisplay(s.closedAt):'', s.openingCash, s.cashSales, s.mpesaSales, s.cardSales, s.transactions, s.expectedCash, s.actualCash, s.difference, s.status]));
    downloadCsv('shifts-'+todayStr()+'.csv', rows);
  }
  logActivity(session.user.name, 'CSV Exported', type);
  saveDB();
}

      </tbody>

    ${!DB.activity.length?`<div class="empty-state">${icon('history')}<div>No activity recorded yet.</div></div>`:''}
  </div>`;
}

/* ================= GLOBAL KEYBOARD SHORTCUTS ================= */
function attachGlobalHandlers(){
  document.onkeydown = function(e){
    if(session.showManagerAuth) return;
    if(!session.user) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(e.key==='Escape'){
      if(session.activeModal){ closeModal(); e.preventDefault(); }
      return;
    }
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
    if(session.screen!=='pos') return;
    if(e.key==='F2'){ e.preventDefault(); const el=document.getElementById('posSearch'); if(el) el.focus(); }
    else if(e.key==='F4'){ e.preventDefault(); clearCart(); }
    else if(e.key==='F8'){ e.preventDefault(); openPaymentModal(); }
  };
}
